name: Test and package

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dps
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: disease_predictions_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dps -d disease_predictions_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://dps:ci-test-password@localhost:5432/disease_predictions_test
      DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt
      - name: Install tested runtime and development tools
        run: |
          python -m pip install --require-hashes -r requirements-runtime.txt
          python -m pip install -r requirements-dev.txt
      - name: Check Python and browser code
        run: |
          ruff check app ml scripts tests
          node --check app/static/app.js
      - name: Run unit and Postgres integration tests
        run: python -m pytest -ra
      - name: Install Chromium
        if: matrix.python == '3.13'
        run: python -m playwright install --with-deps chromium
      - name: Run browser flows
        if: matrix.python == '3.13'
        env:
          RUN_BROWSER_TESTS: "1"
        run: python -m pytest tests/browser -ra

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build application image
        run: docker build -t disease-prediction:test .
      - name: Start application with a dynamic port
        run: |
          docker run -d --name disease-prediction -e PORT=8080 -p 127.0.0.1:8080:8080 disease-prediction:test
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/ready; then exit 0; fi
            sleep 2
          done
          docker logs disease-prediction
          exit 1
      - name: Check frontend and API boundaries
        run: |
          curl -fsS http://127.0.0.1:8080/ | grep -q '<main'
          curl -fsS http://127.0.0.1:8080/static/app.js > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/predictions)" = '503'
          curl -fsS -H 'Content-Type: application/json' \
            -d '{"symptoms":["itching","skin_rash"]}' \
            http://127.0.0.1:8080/predict/symptoms
      - name: Stop container
        if: always()
        run: docker rm -f disease-prediction || true
