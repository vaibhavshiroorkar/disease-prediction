# Free-tier demo. See docs/deployment.md#render.
services:
  - type: web
    name: disease-prediction
    runtime: docker
    plan: free
    # The rate limiter keeps its counts in process memory.
    numInstances: 1
    healthCheckPath: /ready
    envVars:
      # Render's edge sets this to the visitor's address and overwrites any
      # value the client sent.
      - key: CLIENT_IP_HEADER
        value: CF-Connecting-IP
      - key: PRELOAD_MODELS
        value: "1"
